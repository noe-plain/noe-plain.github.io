name: MKW Studio checks
on:
  push:
    paths: ['mkw-studio/**', '.github/workflows/mkw-studio.yml']
  pull_request:
    paths: ['mkw-studio/**', '.github/workflows/mkw-studio.yml']
  workflow_dispatch:
    inputs:
      scope:
        description: Browserprüfungen
        type: choice
        default: all
        options: [all, text-and-scroll]
permissions:
  contents: read
jobs:
  browser_checks:
    name: browser (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mkw-studio/studio
    env:
      MKW_TEST_OUTPUT: /tmp/mkw-test-results
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /mkw-studio/studio/
            /mkw-studio/index.html
            /mkw-studio/style.css
            /mkw-studio/tools.js
            /mkw-studio/main.js
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mkw-studio/studio/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - name: Verify committed build
        id: verify_build
        run: git diff --exit-code -- index.html static/editor.bundle.js static/editor.bundle.css static/editor.bundle.js.map
      - name: Browser regression checks
        if: ${{ matrix.browser == 'chromium' }}
        env:
          MKW_CI_SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$MKW_CI_SCOPE" = "text-and-scroll" ]; then
            node tests/run-browser.mjs inline-fidelity post-workspace modifier-scroll colour-combinations
          else
            npm run test:browser
          fi
      - name: Firefox export regression checks
        if: ${{ matrix.browser == 'firefox' }}
        run: |
          if [ "$MKW_CI_SCOPE" = "text-and-scroll" ]; then
            xvfb-run --auto-servernum node tests/run-browser.mjs inline-fidelity post-workspace modifier-scroll colour-combinations
          else
            xvfb-run --auto-servernum node tests/run-browser.mjs text-editing workspace-entry export-panel psd-post-editability psd-editability project-setup project-dialogs settings-redesign comprehensive-check five-person-check seven-perspectives audit-interactions modifier-scroll colour-combinations material-fields zoom-ui subject-import material-motion material-consistency layer-renaming material-paint-wiki material-bars material-setup material-cards material-inspectors material-start material-workflow material-controls material-ui dialog-layout designer-layout path-continuation templates template-library carousel-limits inline-fidelity text-hyphenation post-text-size-scope text-justification sponsor-auto post-text-stack advanced-typography post-safezones angle-axis post-angle native-incremental-save setup-file large-project-frames project-storage project-open sponsors-help project-retention carousel-photo-effects carousel-refinements workspace-ui interactive-performance carousel-export-images carousel-pdf
          fi
        env:
          MKW_CI_SCOPE: ${{ inputs.scope }}
          MKW_TEST_BROWSER: firefox
          MKW_TEST_HEADED: '1'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mkw-studio-test-results-${{ matrix.browser }}
          path: /tmp/mkw-test-results

  studio:
    needs: browser_checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Both browser checks must succeed
        env:
          BROWSER_CHECK_RESULT: ${{ needs.browser_checks.result }}
        run: test "$BROWSER_CHECK_RESULT" = "success"
