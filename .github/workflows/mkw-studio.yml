name: MKW Studio checks
on:
  push:
    paths: ['mkw-studio/studio/**', '.github/workflows/mkw-studio.yml']
  pull_request:
    paths: ['mkw-studio/studio/**', '.github/workflows/mkw-studio.yml']
  workflow_dispatch:
    inputs:
      scope:
        description: Browserprüfungen
        type: choice
        default: all
        options: [all, text-and-scroll]
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mkw-studio/studio
    env:
      MKW_TEST_OUTPUT: /tmp/mkw-test-results
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: mkw-studio/studio
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mkw-studio/studio/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - name: Verify committed build
        run: git diff --exit-code -- index.html static/editor.bundle.js static/editor.bundle.css static/editor.bundle.js.map
      - name: Browser regression checks
        env:
          MKW_CI_SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$MKW_CI_SCOPE" = "text-and-scroll" ]; then
            node tests/run-browser.mjs inline-fidelity post-workspace modifier-scroll colour-combinations
          else
            npm run test:browser
          fi
      - name: Firefox export regression checks
        run: |
          if [ "$MKW_CI_SCOPE" = "text-and-scroll" ]; then
            xvfb-run --auto-servernum node tests/run-browser.mjs inline-fidelity post-workspace modifier-scroll colour-combinations
          else
            xvfb-run --auto-servernum node tests/run-browser.mjs project-dialogs settings-redesign comprehensive-check five-person-check seven-perspectives audit-interactions modifier-scroll colour-combinations material-fields zoom-ui subject-import material-motion material-consistency layer-renaming material-paint-wiki material-bars material-setup material-cards material-inspectors material-start material-workflow material-controls material-ui dialog-layout designer-layout path-continuation templates template-library carousel-limits inline-fidelity text-hyphenation post-text-size-scope text-justification sponsor-auto post-text-stack advanced-typography post-safezones angle-axis post-angle native-incremental-save setup-file large-project-frames project-storage project-open sponsors-help project-retention carousel-photo-effects carousel-refinements workspace-ui interactive-performance carousel-export-images carousel-pdf
          fi
        env:
          MKW_CI_SCOPE: ${{ inputs.scope }}
          MKW_TEST_BROWSER: firefox
          MKW_TEST_HEADED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mkw-studio-test-results
          path: /tmp/mkw-test-results
