name: MKW Studio checks
on:
  push:
    paths: ['mkw-studio/studio/**', '.github/workflows/mkw-studio.yml']
  pull_request:
    paths: ['mkw-studio/studio/**', '.github/workflows/mkw-studio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mkw-studio/studio
    env:
      MKW_TEST_OUTPUT: /tmp/mkw-test-results
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: mkw-studio/studio
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mkw-studio/studio/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - name: Verify committed build
        run: git diff --exit-code -- index.html static/editor.bundle.js static/editor.bundle.css static/editor.bundle.js.map
      - run: npm run test:browser
      - name: Firefox export regression checks
        run: node tests/run-browser.mjs material-paint-wiki material-bars material-setup material-cards material-inspectors material-start material-workflow material-controls material-ui dialog-layout designer-layout path-continuation templates template-library carousel-limits inline-fidelity text-hyphenation post-text-size-scope text-justification sponsor-auto post-text-stack advanced-typography post-safezones angle-axis post-angle native-incremental-save setup-file large-project-frames project-storage project-open sponsors-help project-retention carousel-photo-effects carousel-refinements workspace-ui interactive-performance carousel-export-images carousel-pdf
        env:
          MKW_TEST_BROWSER: firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mkw-studio-test-results
          path: /tmp/mkw-test-results
