['Hallo, ich bin …','«er» bleibt für alle Personen gleich.','Jeg er her.','Ich bin hier.','Jeg ___ her.','er','hei|hallo; jeg|ich; du|du; å være|sein; her|hier; der|dort; ja|ja; nei|nein; takk|danke; ha det|tschüss'],
['Menschen & Pronomen','Das Verb verändert sich nicht mit der Person.','Vi er sammen.','Wir sind zusammen.','___ er sammen. (Wir)','vi','han|er; hun|sie (Einzahl); vi|wir; dere|ihr; de|sie (Mehrzahl); sammen|zusammen; alene|allein; en venn|ein Freund; et menneske|ein Mensch; en familie|eine Familie'],
['Die wichtigsten Verben','Präsens oft mit -r: ha → har, komme → kommer.','Jeg har tid.','Ich habe Zeit.','Jeg ___ tid. (habe)','har','å ha|haben; å gjøre|machen, tun; å gå|gehen; å komme|kommen; å se|sehen; å si|sagen; å ta|nehmen; å få|bekommen; å gi|geben; å bli|werden, bleiben'],
['Fragen stellen','Fragewort + Verb + Person.','Hvor bor du?','Wo wohnst du?','___ bor du? (Wo)','hvor','hva|was; hvem|wer; hvor|wo; hvordan|wie; hvorfor|warum; når|wann; å spørre|fragen; å svare|antworten; et spørsmål|eine Frage; å bo|wohnen'],
['Nicht, auch, vielleicht','Im einfachen Hauptsatz steht «ikke» nach dem Verb.','Jeg kommer ikke.','Ich komme nicht.','Jeg kommer ___. (nicht)','ikke','ikke|nicht; også|auch; bare|nur; kanskje|vielleicht; alltid|immer; aldri|nie; ofte|oft; igjen|wieder; allerede|schon; nesten|fast'],
['Ein Tag nach dem anderen','Steht die Zeit zuerst, bleibt das Verb an zweiter Stelle.','I dag kommer jeg.','Heute komme ich.','I dag ___ jeg. (komme)','kommer','en dag|ein Tag; en kveld|ein Abend; ei natt|eine Nacht; en morgen|ein Morgen; ei uke|eine Woche; en måned|ein Monat; et år|ein Jahr; nå|jetzt; i dag|heute; i morgen|morgen'],
['Familie & Menschen','«en», «ei», «et» sind unbestimmte Artikel.','Hun har et barn.','Sie hat ein Kind.','Hun har ___ barn.','et','et barn|ein Kind; ei mor|eine Mutter; en far|ein Vater; en mann|ein Mann; ei kvinne|eine Frau; ei jente|ein Mädchen; en gutt|ein Junge; en bror|ein Bruder; ei søster|eine Schwester; et navn|ein Name'],
['Zuhause','Bestimmter Artikel als Endung: et hus → huset.','Huset er stort.','Das Haus ist gross.','___ er stort. (Das Haus)','huset','et hus|ein Haus; et rom|ein Zimmer; ei dør|eine Tür; et vindu|ein Fenster; et bord|ein Tisch; en stol|ein Stuhl; ei seng|ein Bett; et kjøkken|eine Küche; hjemme|zu Hause; hjem|nach Hause'],
['Unterwegs','«til» bezeichnet oft ein Ziel, «fra» eine Herkunft.','Jeg går til skolen.','Ich gehe zur Schule.','Jeg går ___ skolen. (zur)','til','en by|eine Stadt; et land|ein Land; en vei|ein Weg; et sted|ein Ort; en plass|ein Platz; en skole|eine Schule; en bil|ein Auto; en buss|ein Bus; til|zu, nach; fra|von, aus'],
['Wo genau?','Ortsangaben folgen oft auf das Verb.','Boka er på bordet.','Das Buch liegt auf dem Tisch.','Boka er ___ bordet. (auf)','på','i|in; på|auf, an; under|unter; over|über; mellom|zwischen; foran|vor; bak|hinter; ved|bei, neben; hos|bei (Personen); utenfor|ausserhalb'],
['Verbindungen','«og» verbindet, «men» zeigt einen Gegensatz.','Jeg vil komme, men jeg har ikke tid.','Ich will kommen, aber ich habe keine Zeit.','Jeg vil komme, ___ jeg har ikke tid. (aber)','men','og|und; eller|oder; men|aber; fordi|weil; at|dass; hvis|falls, wenn; som|der/die/das; enn|als (Vergleich); både|sowohl; derfor|deshalb'],
['Können, wollen, müssen','Nach Modalverben folgt der Infinitiv ohne «å».','Jeg kan snakke norsk.','Ich kann Norwegisch sprechen.','Jeg ___ snakke norsk. (kann)','kan','å kunne|können; å ville|wollen; å måtte|müssen; å skulle|sollen, werden; å burde|sollen (Rat); å trenge|brauchen; å ønske|wünschen; å prøve|versuchen; å la|lassen; å hjelpe|helfen'],
['Lernen & Sprechen','«å» steht vor dem Infinitiv: å lære.','Jeg liker å lære.','Ich lerne gern.','Jeg liker ___ lære.','å','å snakke|sprechen; å høre|hören; å lese|lesen; å skrive|schreiben; å lære|lernen; å forstå|verstehen; et ord|ein Wort; et språk|eine Sprache; norsk|norwegisch; ei bok|ein Buch'],
['Denken & Wissen','«vite»: eine Tatsache wissen. «kjenne»: jemanden kennen.','Jeg vet det.','Ich weiss es.','Jeg ___ det. (weiss)','vet','å vite|wissen; å kjenne|kennen; å tenke|denken; å tro|glauben; å mene|meinen; å synes|finden, meinen; å huske|sich erinnern; å glemme|vergessen; å føle|fühlen; å like|mögen'],
['Essen & Trinken','«et» verlangt oft ein -t am Adjektiv: kaldt vann.','Jeg drikker kaldt vann.','Ich trinke kaltes Wasser.','Jeg drikker ___ vann. (kaltes)','kaldt','mat|Essen; vann|Wasser; en kaffe|ein Kaffee; en te|ein Tee; melk|Milch; et brød|ein Brot; en fisk|ein Fisch; et egg|ein Ei; å spise|essen; å drikke|trinken'],
['Eigenschaften','Adjektive: en stor by, et stort hus.','Det er et stort hus.','Das ist ein grosses Haus.','Det er et ___ hus. (grosses)','stort','stor|gross; liten|klein; god|gut; dårlig|schlecht; ny|neu; gammel|alt; ung|jung; lang|lang; kort|kurz; viktig|wichtig'],

function toast(t){$('#toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',4500)}
function audioButton(text,label='Norwegisch vorlesen'){return `<button type="button" class="icon audio" data-speak="${esc(text)}" aria-label="${esc(label)}">${icons.sound}</button>`}
// Speech is always optional. Never substitute a non-Norwegian voice.
const speech=(()=>{let synth=null,voice=null,utterance=null,generation=0,watchdog=null,activated=false;try{synth=window.speechSynthesis||null}catch(_){}function refresh(){try{const vs=synth?synth.getVoices():[];voice=vs.filter(v=>/^(nb|no)(-NO)?$/i.test(v.lang.replace('_','-'))).sort((a,b)=>Number(b.localService)-Number(a.localService))[0]||null}catch(_){voice=null}const status=$('#voice-status');if(status)status.textContent=description()}
function paint(text,on){document.querySelectorAll('[data-speak]').forEach(el=>{const active=on&&el.dataset.speak===text;el.classList.toggle('speaking',active);el.setAttribute('aria-pressed',String(active))})}
function stop(){generation++;clearTimeout(watchdog);try{if(synth)synth.cancel()}catch(_){}utterance=null;paint('',false)}
function description(){return !synth?'Dieser Browser unterstützt kein Vorlesen.':voice?`Bereit: ${voice.name} (${voice.lang}).`:'Keine norwegische Stimme verfügbar. Installiere eine norwegische Systemstimme und öffne die App erneut. Lernen geht auch ohne Audio.'}
function speak(text,manual=false){stop();if(manual)activated=true;refresh();if(!synth||!voice){if(manual)toast(description());return}if(!activated&&!manual)return;const token=generation;try{const u=new SpeechSynthesisUtterance(text);utterance=u;u.voice=voice;u.lang=/^no/i.test(voice.lang)?'no-NO':'nb-NO';u.rate=.85;u.pitch=1;u.onstart=()=>{if(token===generation)paint(text,true)};u.onend=()=>{if(token===generation){paint('',false);clearTimeout(watchdog);utterance=null}};u.onerror=e=>{if(token!==generation)return;paint('',false);clearTimeout(watchdog);utterance=null;if(e.error!=='canceled'&&e.error!=='interrupted')toast('Audio wurde nicht gestartet. Tippe nochmals auf den Lautsprecher.');};synth.speak(u);watchdog=setTimeout(()=>{if(token===generation){stop();if(manual)toast('Audio ist gerade nicht verfügbar. Du kannst direkt weiterlernen.')}},Math.max(10000,text.length*130))}catch(_){stop();if(manual)toast('Vorlesen ist auf diesem Gerät gerade nicht verfügbar.')}}
if(synth){refresh();if(synth.addEventListener)synth.addEventListener('voiceschanged',refresh);[250,1000,3000].forEach(ms=>setTimeout(refresh,ms))}return{stop,speak,refresh,description,available(){return Boolean(voice)},activate(){activated=true},auto(text){if(state.autoAudio)speak(text)}}})();
function applyTheme(){const dark=state.theme==='dark'||(state.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.dataset.theme=dark?'dark':'light';$('#theme').setAttribute('aria-label',dark?'Helles Farbschema aktivieren':'Dunkles Farbschema aktivieren')}
function dueWords(){return [...words.values()].filter(w=>state.progress[w.id]?.seen&&state.progress[w.id].due<=Date.now()).sort((a,b)=>state.progress[a.id].due-state.progress[b.id].due)}
function seen(u){return u.words.filter(w=>state.progress[w.id]?.seen).length}
function complete(u){return u.words.every(w=>(state.progress[w.id]?.level||0)>=1)&&(!u.grammar||state.grammarDone.includes(u.id))}

function start(id){if(state.round&&state.round.phase!=='done'){toast('Setze zuerst deine angefangene Runde fort.');resume();return}const u=units.get(id);if(!u)return;const sorted=[...u.words].sort((a,b)=>{const pa=state.progress[a.id],pb=state.progress[b.id];const score=p=>!p?0:p.due<=Date.now()?1:2;return score(pa)-score(pb)||(pa?.due||0)-(pb?.due||0)}).slice(0,5);newRound(sorted,u)}
function newRound(list,u=null){if(!list.length){toast('Gerade ist nichts fällig. Wähle eine Einheit.');return}state.round={unit:u?.id||null,queue:list.slice(0,5).map(w=>({id:w.id,retry:false})),initial:Math.min(5,list.length),index:0,correct:0,phase:u?.grammar?'grammar':'cards',revealed:false,reverse:state.reverse,mixed:state.mixed,exampleIndex:u?((state.visits[u.id]||0)%(u.examples?.length||1)):0,audioReady:speech.available(),exercise:null,puzzle:[]};if(u)state.visits[u.id]=(state.visits[u.id]||0)+1;save();resume()}

function autoCurrent(){const r=state.round;if(r?.phase!=='cards')return;const mode=cardMode(r);if(mode==='listen'||(mode==='flash'&&(!r.reverse||r.revealed))||(mode==='choice'&&!r.reverse)||r.revealed)speech.auto(words.get(r.queue[r.index].id).no)}
function learn(){const r=state.round;if(!r)return home();const u=units.get(r.unit),g=grammarFor(r,u);const head=`<div class="learn-head"><button class="icon" data-action="pause" aria-label="Runde pausieren">×</button><div><div class="row between"><span class="small">${esc(u?.title||'Deine Wiederholung')}</span><span class="small">${r.phase==='grammar'?'Kurz erklärt':r.phase==='quiz'?'Satztraining':r.phase==='done'?'Geschafft':Math.min(r.index+1,r.queue.length)+' / '+r.queue.length}</span></div><div class="track"><i style="width:${r.phase==='done'?100:r.index/r.queue.length*100}%"></i></div></div></div>`;
if(r.phase==='grammar')return `<div class="study">${head}<section class="panel grammar"><span class="eyebrow">EIN GEDANKE, DANN GEHT’S LOS</span><h2>${esc(u.title)}</h2><p class="small muted">${esc(u.level||'Eigene Einheit')} · ${esc(u.goal||'Wörter im Zusammenhang anwenden.')}</p><div class="spacer"></div><p>${esc(g.rule)}</p><div class="example"><div class="row"><p class="nb" lang="nb">${esc(g.example)}</p>${audioButton(g.example,'Norwegischen Beispielsatz vorlesen')}</div><p class="muted small">${esc(g.translation)}</p></div>${exampleSwitcher(r,u)}</section><div class="spacer"></div><p class="tip">Hör auf die Sprachmelodie. Sprich den Satz einmal laut nach.</p><div class="dock"><button class="btn full" data-action="begin">${r.grammarOnly?'Satztraining wiederholen':'Mit '+r.initial+' Wörtern loslegen'} ${icons.arrow}</button></div></div>`;

// Mix recognition, productive recall and listening. Older saved rounds remain classic.
function normalise(t){return String(t).normalize('NFC').toLocaleLowerCase('nb-NO').trim().replace(/[.!?]+$/,'').replace(/\s+/g,' ')}
function cardMode(r){if(!r.mixed||r.queue[r.index]?.retry)return 'flash';const mode=['flash','choice','typing','listen','flash'][r.index%5];return mode==='listen'&&(!r.audioReady||r.textFallback)?'choice':mode}
function choiceWords(r){const w=words.get(r.queue[r.index].id),targetKey=cardMode(r)==='listen'?'de':r.reverse?'no':'de';const pool=[w],labels=new Set([normalise(w[targetKey])]);const candidates=[...units.get(w.unit).words,...words.values()];for(const candidate of candidates){if(!labels.has(normalise(candidate[targetKey]))){pool.push(candidate);labels.add(normalise(candidate[targetKey]))}if(pool.length===3)break}return pool.sort((a,b)=>hash(a.id+r.index)-hash(b.id+r.index))}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0}
function exerciseView(r,head){const w=words.get(r.queue[r.index].id),mode=cardMode(r),result=r.exercise,listen=mode==='listen',typing=mode==='typing',choices=typing?[]:choiceWords(r),key=listen?'de':r.reverse?'no':'de',prompt=typing?w.de:r.reverse?w.de:w.no;const feedback=result?`<div class="exercise-feedback" role="status"><strong>${result.correct?'Richtig · godt jobbet!':'Noch nicht ganz · das üben wir nochmals.'}</strong><div class="row"><p><b lang="nb">${esc(w.no)}</b><br>${esc(w.de)}</p>${audioButton(w.no)}</div>${typing&&!result.correct?`<p class="small muted">Deine Antwort: ${esc(result.guess)}</p>`:''}</div>`:'';return `<div class="study">${head}<p class="eyebrow flash-label">${listen?'LYTT · HÖR GENAU HIN':typing?'SKRIV · SELBST SCHREIBEN':'VELG · WÄHLE DIE BEDEUTUNG'}</p><section class="panel card"><p class="small muted">${listen?'Höre das Wort. Welche Bedeutung passt?':typing?'Wie schreibst du das auf Norwegisch?':'Welche Übersetzung passt?'}</p>${listen?`<button class="icon audio listen-orb" data-speak="${esc(w.no)}" aria-label="Norwegisches Wort anhören">${icons.sound}</button><span class="small muted">Tippe zum Anhören · so oft du möchtest</span><button class="small" style="min-height:44px;text-decoration:underline" data-puzzle-action="text-fallback">Lieber als Text üben</button>`:`<h2 ${typing||r.reverse?'':'lang="nb"'}>${esc(prompt)}</h2>`}${typing?`<form id="spelling-form" class="exercise-form"><label>Deine norwegische Antwort<input name="answer" lang="nb" maxlength="250" autocomplete="off" autocapitalize="none" spellcheck="false" required ${result?'disabled':''} value="${esc(result?.guess||'')}" placeholder="Hier tippen …"></label>${!result?'<p class="small muted">Schreibe auch «å» oder den Artikel mit, wenn er zum Lerneintrag gehört.</p><button class="btn full" type="submit">Antwort prüfen</button>':''}</form>`:`<div class="choice-list">${choices.map((c,i)=>`<button class="choice ${result?(c.id===w.id?'right':result.guess===c.id?'wrong':''):''}" d function answerChoice(index){const r=state.round;if(!r||r.phase!=='cards'||r.revealed||!['choice','listen'].includes(cardMode(r)))return;const choice=choiceWords(r)[index];if(choice)answerExercise(choice.id===r.queue[r.index].id,choice.id)}
function answerExercise(correct,guess){const r=state.round;if(!r||r.phase!=='cards'||r.revealed||Date.now()<guardUntil)return;guardUntil=Date.now()+400;speech.stop();r.exercise={correct,guess:String(guess)};r.revealed=true;save();render(false);autoCurrent()}
function puzzleView(r,g,head){const tokens=g.example.trim().split(/\s+/),selected=r.puzzle||[],order=tokens.map((_,i)=>i).sort((a,b)=>hash(r.unit+':'+a)-hash(r.unit+':'+b));if(order.every((n,i)=>n===i)&&order.length>1)order.reverse();return `<div class="study">${head}<section class="panel grammar"><p class="eyebrow">BYGG EN SETNING · BAUE EINEN SATZ</p><h2>${esc(g.translation)}</h2><p class="small muted">Tippe die Wörter in der richtigen Reihenfolge an.</p><div class="sentence-tray" aria-label="Dein Satz"><div class="word-bank">${selected.map((n,i)=>`<button class="word-token" data-token="${n}" lang="nb" aria-label="${esc(tokens[n])}, Position ${i+1}, entfernen">${esc(tokens[n])}</button>`).join('')}</div>${!selected.length?'<p>Hier entsteht dein norwegischer Satz …</p>':''}</div><div class="word-bank" aria-label="Verfügbare Wörter">${order.filter(n=>!selected.includes(n)).map(n=>`<button class="word-token" data-token="${n}" lang="nb">${esc(tokens[n])}</button>`).join('')}</div><div class="puzzle-tools"><button data-puzzle-action="reset">Neu ordnen</button><button data-unknown="grammar">Weiss ich noch nicht</button></div><p id="puzzle-feedback" role="status" class="small"></p></section><div class="dock"><button class="btn full" data-puzzle-action="check" ${selected.length!==tokens.length?'disabled':''}>Satz prüfen ${icons.arrow}</button></div><p class="tip">${esc(g.rule)}</p></div>`}
function moveToken(index){const r=state.round;if(!r||r.phase!=='quiz'||!r.mixed)return;const g=grammarFor(r,units.get(r.unit)),tokens=g.example.trim().split(/\s+/);if(!Number.isInteger(index)||index<0||index>=tokens.length)return;const selected=r.puzzle||(r.puzzle=[]),at=selected.indexOf(index);if(at>=0)selected.splice(at,1);else selected.push(index);save();render(false)}
function puzzleAction(action){const r=state.round;if(!r)return;if(action==='text-fallback'&&r.phase==='cards'){speech.stop();r.textFallback=true;save();render();return}if(r.phase!=='quiz'||!r.mixed)return;const g=grammarFor(r,units.get(r.unit));if(action==='reset'){r.puzzle=[];save();render(false)}if(action==='hint'){grammarFail(r);$('#puzzle-feedback').textContent=g.example;speech.auto(g.example)}if(action==='check'){const tokens=g.example.trim().split(/\s+/);if((r.puzzle||[]).map(n=>tokens[n]).join(' ')!==g.example.trim()){grammarFail(r);$('#puzzle-feedback').textContent='Fast! Achte auf die Wortstellung. Du kannst einzelne Wörter antippen und neu einsetzen.';return}finishGrammar(r)}}


function exampleFor(r,u,offset=0){const list=u?.examples;return list?.length?list[((r.exampleIndex||0)+offset)%list.length]:{no:u?.grammar?.example||'',de:u?.grammar?.translation||''}}
function grammarFor(r,u){if(!u?.grammar)return null;const e=exampleFor(r,u);return r.phase==='grammar'||(r.phase==='quiz'&&r.mixed)?{...u.grammar,example:e.no,translation:e.de}:u.grammar}
function exampleSwitcher(r,u){return u?.examples?.length>1?`<button class="example-switch" data-example="next">Anderes Beispiel · ${(r.exampleIndex||0)+1} / ${u.examples.length} ↻</button>`:''}
function cycleExample(){const r=state.round,u=units.get(r?.unit);if(r?.phase!=='grammar'||!u?.examples?.length)return;speech.stop();r.exampleIndex=((r.exampleIndex||0)+1)%u.examples.length;save();render(false)}
function grammarFail(r){r.grammarAssisted=true;state.grammarDue[r.unit]=Date.now()+600000;state.grammarDone=state.grammarDone.filter(id=>id!==r.unit);save()}
function finishGrammar(r){if(r.grammarAssisted)state.grammarDue[r.unit]=Date.now()+600000;else{delete state.grammarDue[r.unit];if(!state.grammarDone.includes(r.unit))state.grammarDone.push(r.unit)}r.phase='done';speech.stop();save();render()}
function unknown(kind){const r=state.round;if(!r||Date.now()<guardUntil)return;guardUntil=Date.now()+350;speech.stop();if(kind==='card'&&r.phase==='cards'&&!r.revealed){r.unknown=true;r.exercise={correct:false,guess:'Weiss ich noch nicht'};r.revealed=true;const item=r.queue[r.index];state.progress[item.id]=schedule(state.progress[item.id],false,Date.now());save();render();return}if(kind==='grammar'&&r.phase==='quiz'){grammarFail(r);r.grammarHelp=true;save();render()}}
function grammarHelpView(r,g,head){const u=units.get(r.unit),c=u?.challenge;return `<div class="study">${head}<section class="panel stack"><p class="eyebrow">KEIN PROBLEM · WIR ÜBEN DAS NOCHMALS</p><h2>Schau dir die Lösung an.</h2>${c?`<p>${esc(c.options[c.correct])}</p><p class="muted">${esc(c.explanation)}</p><div class="model" lang="nb">${esc(c.model)}</div>${audioButton(c.model)}`:`<div class="row between"><p lang="nb">${esc(g.example)}</p>${audioButton(g.example)}</div><p class="muted">${esc(g.translation)}</p><p>${esc(g.rule)}</p>`}<p class="tip">Als «noch üben» gespeichert. Kein bestandener Schritt; in 10 Minuten wieder fällig.</p></section><div class="dock"><button class="btn full" data-action="defer-grammar">Weiter · später wiederholen</button></div></div>`}
function grammarReviewBanner(){const entries=Object.entries(state.grammarDue||{}).filter(([id])=>units.has(id)).sort((a,b)=>a[1]-b[1]);if(!entries.length)return '';const [id,due]=entries[0];return `<section class="grammar-review"><b>${entries.length} Satztraining${entries.length===1?'':'s'} noch offen</b><p class="small muted">${esc(units.get(id).title)} · ${due<=Date.now()?'jetzt fällig':'in '+Math.max(1,Math.ceil((due-Date.now())/60000))+' Minuten fällig'}</p><button class="btn secondary full" data-grammar-review="${esc(id)}">${due<=Date.now()?'Satztraining wiederholen':'Schon jetzt nochmals üben'}</button></section>`}
function grammarReview(id){if(state.round&&state.round.phase!=='done'){resume();toast('Deine angefangene Runde wartet noch.');return}const u=units.get(id);if(!u?.grammar)return;newRound(u.words.slice(0,1),u);state.round.grammarOnly=true;save();render()}
function challengeView(r,u,head){const c=u.challenge,result=r.challengeResult;return `<div class="study">${head}<section class="panel stack"><p class="eyebrow">${u.level} · VERSTEHEN & ANWENDEN</p><h2>${esc(u.title)}</h2><p class="small muted">${esc(u.goal)}</p><div class="reading" lang="nb">${esc(c.text)}</div><div class="row">${audioButton(c.text,'Text auf Norwegisch anhören')}<span class="small muted">Lesen oder anhören</span></div><h3>${esc(c.question)}</h3><div class="choice-list">${c.options.map((option,i)=>`<button class="choice ${result?(i===c.correct?'right':result.index===i?'wrong':''):''}" data-challenge="${i}" ${result?'disabled':''}><span>${i+1}</span><span>${esc(option)}</span></button>`).join('')}</div>${result?`<p class="tip" role="status">${result.correct?'Richtig. ':'Noch nicht ganz. '}${esc(c.explanation)}</p><h3>Jetzt selbst formulieren</h3><p>${esc(c.prompt)}</p><label>Dein Text auf Norwegisch<textarea id="challenge-draft" lang="nb" maxlength="3000" placeholder="Schreibe deine Antwort …">${esc(r.draft||'')}</textarea></label><p class="small muted">Deine freie Antwort wird nicht automatisch benotet. Prüfe sie anhand dieser Kriterien.</p><div class="stack check-list">${c.checks.map((x,i)=>`<label><input type="checkbox" data-selfcheck="${i}">${esc(x)}</label>`).join('')}</div><button class="btn secondary" data-challenge-action="model">Musterantwort ansehen · mit Hilfe üben</button>${r.showModel?`<div class="model" lang="nb">${esc(c.model)}</div>${audioButton(c.model)}`:''}<button class="btn full" data-challenge-action="finish">Selbst geprüft · Runde abschliessen</button>`:''}<button class="btn secondary" data-unknown="grammar">Weiss ich noch nicht</button></section></div>`}
function answerChallenge(index){const r=state.round,c=units.get(r?.unit)?.challenge;if(!c||r.phase!=='quiz'||r.challengeResult||!Number.isInteger(index)||index<0||index>=c.options.length)return;r.challengeResult={index,correct:index===c.correct};if(!r.challengeResult.correct)grammarFail(r);save();render(false)}
function challengeAction(action){const r=state.round,c=units.get(r?.unit)?.challenge;if(!c||r.phase!=='quiz'||!r.challengeResult)return;if(action==='model'){r.showModel=true;grammarFail(r);save();render(false)}if(action==='finish'){const input=$('#challenge-draft');r.draft=input?.value||r.draft||'';if(!r.draft.trim()){toast('Schreibe zuerst deine Antwort oder wähle «Weiss ich noch nicht».');return}const checks=[...document.querySelectorAll('[data-selfcheck]')];if(checks.length!==c.checks.length||checks.some(el=>!el.checked)){toast('Prüfe deine Antwort anhand aller Kriterien oder übe mit der Musterantwort.');return}finishGrammar(r)}}

function schedule(old,correct,now){if(!correct)return{level:0,due:now+600000,seen:true};if(old&&old.due>now)return{...old,seen:true};const level=Math.min((old?.level||0)+1,6);return{level,due:now+INTERVALS[level-1]*DAY,seen:true}}
function rate(correct){const r=state.round;if(!r||r.phase!=='cards'||!r.revealed||Date.now()<guardUntil)return;guardUntil=Date.now()+400;speech.stop();if(r.unknown)correct=false;const item=r.queue[r.index];if(!item.retry){const recognition=['choice','listen'].includes(cardMode(r));state.progress[item.id]=recognition&&correct?{level:state.progress[item.id]?.level||0,due:state.progress[item.id]?.due>Date.now()?state.progress[item.id].due:Date.now()+DAY,seen:true}:schedule(state.progress[item.id],correct,Date.now());if(correct)r.correct++;else r.queue.push({id:item.id,retry:true})} // Retry reinforces recall; it never grants a second SRS level.
else if(!correct)state.progress[item.id]={level:0,due:Date.now()+600000,seen:true};r.index++;r.revealed=false;r.exercise=null;r.textFallback=false;r.unknown=false;if(r.index>=r.queue.length)r.phase=units.get(r.unit)?.grammar?'quiz':'done';save();render();autoCurrent()}
function vocabulary(){return `<div class="row between section-head"><div><p class="eyebrow">DEIN PERSÖNLICHES WÖRTERBUCH</p><h1 style="font-size:36px;margin-top:10px">Wort für Wort.</h1></div></div><p class="muted">${words.size} Wörter und Sätze. Platz für deine eigenen.</p><div class="spacer"></div><button class="btn full" data-nav="add">+ Eigenes Wort oder Satz</button><div class="spacer"></div><label>Suchen<input id="search" type="search" placeholder="Norwegisch oder Deutsch …" autocomplete="off"></label><div class="spacer"></div><div id="word-results" class="word-list">${wordRows('')}</div>`}
function wordRows(query){const filtered=[...words.values()].filter(w=>(w.no+' '+w.de).toLocaleLowerCase().includes(query.toLocaleLowerCase()));return filtered.length?filtered.map(w=>`<div class="word-row"><div><strong lang="nb">${esc(w.no)}</strong><p>${esc(w.de)}</p><span class="small muted">${state.progress[w.id]?'Stufe '+state.progress[w.id].level+' · '+(state.progress[w.id].due<=Date.now()?'jetzt fällig':'ab '+new Date(state.progress[w.id].due).toLocaleDateString('de-CH')):'Noch nicht geübt'}</span></div>${audioButton(w.no)}</div>`).join(''):'<p class="muted">Kein passendes Wort gefunden.</p>'}
function addForm(){return `<div class="study stack"><button class="btn secondary" data-nav="words">← Zum Wortschatz</button><div><p class="eyebrow">DEIN ALLTAG, DEINE WÖRTER</p><h2 style="margin-top:12px">Was möchtest du lernen?</h2></div><form id="add-form" class="panel"><label>Norwegisches Wort oder Satz<input name="no" maxlength="250" required placeholder="z. B. å svømme" lang="nb"></label><label>Deutsche Bedeutung<input name="de" maxlength="250" required placeholder="schwimmen"></label><label>Beispielsatz auf Norwegisch (optional)<input name="sentence" maxlength="500" placeholder="Jeg liker å svømme." lang="nb"></label><label>Übersetzung des Beispielsatzes<input name="sentenceDe" maxlength="500" placeholder="Ich schwimme gern."></label><button class="btn" type="submit">Zum Lernpfad hinzufügen +</button><p class="small muted">Eigene Inhalte erscheinen als separate Einheit und werden mit wiederholt.</p></form></div>`}
const template={units:[{id:'extra1',title:'Am Wasser',grammar:{rule:'Nach «liker» folgt å + Infinitiv.',example:'Jeg liker å svømme.',translation:'Ich schwimme gern.',question:'Jeg liker ___ svømme.',answer:'å'},words:[{id:'extra1w1',no:'å svømme',de:'schwimmen',sentence:'Jeg liker å svømme.',sentenceDe:'Ich schwimme gern.'}]}]};
function settings(){return `<div class="study stack"><div><p class="eyebrow">SO LERNST DU AM LIEBSTEN</p><h1 style="font-size:36px;margin-top:10px">Dein Rhythmus.</h1></div><section class="panel stack"><h3>Dein Lernmix</h3><label class="settings-row">Abwechslungsreiche Übungen<input id="mixed" type="checkbox" ${state.mixed?'checked':''}></label><p class="small muted">Karteikarten, Auswahlfragen, Schreiben, Hören und Satzpuzzle. Ausgeschaltet: klassische Karten mit Lückensatz. Gilt ab der nächsten Runde.</p><h3>Audio & Darstellung</h3><label class="settings-row">Automatisch vorlesen<input id="auto-audio" type="checkbox" ${state.autoAudio?'checked':''}></label><p class="small muted">Nach deiner ersten Interaktion, sofern der Browser es erlaubt. Der Lautsprecher funktioniert auch manuell.</p><p class="small" id="voice-status">${esc(speech.description())}</p><div class="row">${audioButton('Hei! Hvordan har du det?','Norwegische Stimme testen')}<span class="small">Stimme testen · langsam & deutlich</span></div><label class="settings-row">Deutsch → Norwegisch<input id="reverse" type="checkbox" ${state.reverse?'checked':''}></label><p class="small muted">Gilt ab der nächsten Runde. Audio startet erst beim Aufdecken der norwegischen Antwort.</p><label>Darstellung<select id="theme-select"><option value="system" ${state.theme==='system'?'selected':''}>Wie das Gerät</option><option value="light" ${state.theme==='light'?'selected':''}>Hell</option><option value="dark" ${state.theme==='dark'?'selected':''}>Dunkel</option></select></label></section><section class="panel stack"><h3>Dein Lernstand</h3><p class="small muted">Bleibt auf diesem Gerät und in diesem Browser. Exportiere eine Sicherung, bevor du Browserdaten löschst oder das Gerät wechselst.</p><button class="btn secondary" data-action="export">Sicherung herunterladen ↓</button><label>Sicherung wiederherstellen<input type="file" id="restore" accept="application/json,.json"></label><p class="small muted">Ein Import ersetzt den aktuellen Stand nach deiner Bestätigung.</p></section><section class="panel stack"><h3>Warum kleine Schritte wirken</h3><p class="small">Erst selbst erinnern, dann die Antwort sehen: Active Recall. Wiederholen nach 1, 3, 7, 14, 30 und 60 Tagen: Spaced Repetition. Auswahl- und Hörfragen vertiefen das Erkennen; sie erhöhen die Wiederholungsstufe nicht. Fällige Karten werden am Folgetag wiederholt; ein späterer bestehender Termin bleibt erhalten. «Noch üben» setzt die Karte zurück; sie erscheint am Rundenende und nach 10 Minuten erneut. Freiwilliges Üben vor dem Termin erhöht die Stufe nicht.</p><p class="small">${BASE.reduce((n,u)=>n+u.words.length,0)} redaktionell zusammengestellte Bokmål-Lerneinträge, orientiert an der <a href="https://norwegianacademy.com/wp-content/uploads/2019/08/Ebook-300-most-common-words-used-in-the-Norwegian-language.pdf" target="_blank" rel="noopener">Häufigkeitsliste der Norwegian Academy</a>, ergänzt um Alltagssprache. Keine exakte Wiedergabe oder Rangfolge der PDF. Eigene deutsche Übersetzungen und Grammatikbeispiele.</p><p class="small">Weitere Anregungen für Einsteigerthemen: <a href="https://preply.com/de/blog/norwegisch-lernen/" target="_blank" rel="noopener">Preply: Norwegisch lernen</a> und <a href="https://preply.com/de/blog/norwegische-woerter/" target="_blank" rel="noopener">Preply: Alltagswortschatz</a>. Die Einteilung der eigens erstellten Aufgaben orientiert sich an den <a href="https://hkdirweb-prod.azurewebsites.net/voksenopplaering/norsk-og-samfunnskunnskap/norskkrav-i-arbeidslivet/hva-betyr-nivaene-i-norskproven" target="_blank" rel="noopener">Niveaubeschreibungen von HK-dir</a>. Einzelne Wörter haben kein eindeutiges GER-Niveau. Anspruch, Kontext und Sprachhandlung bestimmen die Zuordnung. Die Module sind Übungsmaterial, kein vollständiger A1–C1-Kurs und keine Einstufungsprüfung.</p><p class="small muted">Die Datei funktioniert ohne Bibliotheken, Netzabrufe oder Anmeldung. Audio hängt von den Systemstimmen ab; manche Stimmen benötigen Internet. Dies ist eine PWA-ähnliche Ein-Datei-App, ohne installierbare Offline-PWA oder Service Worker.</p><details><summary>Inhalte erweitern</summary><p class="small muted">Tippe fünfmal rasch auf «liten», um den JSON-Editor zu öffnen. Die Datenstruktur erlaubt zusätzliche Einheiten mit eigener Grammatik, Wörtern und Beispielsätzen.</p></details></section></div>`}
function editor(){return `<div class="study stack"><h2>Inhaltswerkstatt</h2><p class="muted">Neue Einheiten als JSON ergänzen. IDs müssen eindeutig sein. Bestehende Einheiten werden nicht überschrieben.</p><form id="editor-form"><label>Einheiten-JSON<textarea name="json" id="unit-json" rows="17" spellcheck="false">${esc(JSON.stringify(template,null,2))}</textarea></label><button class="btn" type="submit">Prüfen & hinzufügen</button></form><button class="btn secondary" data-nav="settings">Zurück</button></div>`}
function render(focus=true){document.body.classList.toggle('session',view==='learn');$('#app').innerHTML=({home,learn,words:vocabulary,add:addForm,settings,editor}[view]||home)();document.querySelectorAll('[data-nav]').forEach(el=>{if(el.closest('nav')){if(el.dataset.nav===view)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')}});if(focus){window.scrollTo(0,0);$('#app').focus({preventScroll:true})}}

function download(data,name){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;speech.activate();if(b.dataset.level){state.levelFilter=b.dataset.level;save();navigate('home');return}if(b.dataset.unknown){unknown(b.dataset.unknown);return}if(b.dataset.example){cycleExample();return}if(b.dataset.grammarReview){grammarReview(b.dataset.grammarReview);return}if(b.dataset.challenge!==undefined){answerChallenge(Number(b.dataset.challenge));return}if(b.dataset.challengeAction){challengeAction(b.dataset.challengeAction);return}if(b.dataset.choice!==undefined){answerChoice(Number(b.dataset.choice));return}if(b.dataset.token!==undefined){moveToken(Number(b.dataset.token));return}if(b.dataset.exerciseNext!==undefined){if(state.round?.exercise)rate(state.round.exercise.correct);return}if(b.dataset.puzzleAction){puzzleAction(b.dataset.puzzleAction);return}if(b.dataset.speak){speech.speak(b.dataset.speak,true);return}if(b.id==='theme'){state.theme=document.body.dataset.theme==='dark'?'light':'dark';applyTheme();save();return}if(b.id==='brand'){brandTaps++;clearTimeout(brandTimer);brandTimer=setTimeout(()=>brandTaps=0,1800);if(brandTaps>=5){brandTaps=0;editorOpen=true;navigate('editor')}else if(view!=='home')navigate('home');return}if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.dataset.start){if(Date.now()<guardUntil)return;guardUntil=Date.now()+350;start(b.dataset.start);return}if(b.dataset.rate!==undefined){rate(b.dataset.rate==='1');return}const a=b.dataset.action,r=state.round;if(a==='pause'){navigate('home');return}if(a==='resume'){resume();return}if(a==='review'){if(state.round)resume();else newRound(dueWords());return}if(a==='export'){download(state,'liten-sicherung.json');toast('Sicherung erstellt.');return}if(!a)return;if(Date.now()<guardUntil)return;guardUntil=Date.now()+350;if(a==='begin'&&r?.phase==='grammar'){speech.stop();r.phase=r.grammarOnly?'quiz':'cards';save();render();autoCurrent()}if(a==='reveal'&&r?.phase==='cards'&&!r.revealed){speech.stop();r.revealed=true;save();render(false);speech.auto(words.get(r.queue[r.index].id).no)}if(a==='defer-grammar'&&r?.phase==='quiz'){r.phase='done';save();render();return}if(a==='finish'&&r?.phase==='done'){state.round=null;save();navigate('home')}});
document.addEventListener('submit',e=>{if(!['quiz-form','add-form','editor-form','spelling-form'].includes(e.target.id))return;e.preventDefault();const f=e.target,data=new FormData(f);if(f.id==='spelling-form'){const r=state.round;if(r?.phase==='cards'&&cardMode(r)==='typing'&&!r.revealed)answerExercise(normalise(data.get('answer'))===normalise(words.get(r.queue[r.index].id).no),data.get('answer'));return}if(f.id==='quiz-form'){const r=state.round;if(!r||r.phase!=='quiz')return;const g=units.get(r.unit).grammar,normal=s=>s.normalize('NFC').trim().toLocaleLowerCase('nb-NO').replace(/[.!?]$/,'');if(normal(data.get('answer'))!==normal(g.answer)){const feedback=$('#quiz-feedback');feedback.textContent=`Fast! Die Lösung ist «${g.answer}». Tippe sie ein und präge dir den Satz ein.`;feedback.className='error small';grammarFail(r);return}finishGrammar(r);return}if(f.id==='add-form'){try{const no=data.get('no').trim(),de=data.get('de').trim(),sentence=data.get('sentence').trim(),sentenceDe=data.get('sentenceDe').trim();assert(no&&de,'Bitte Wort und Übersetzung ausfüllen.');assert(Boolean(sentence)===Boolean(sentenceDe),'Bitte Beispielsatz und Übersetzung zusammen ausfüllen.');assert(![...words.values()].some(w=>w.no.toLowerCase()===no.toLowerCase()&&w.de.toLowerCase()===de.toLowerCase()),'Dieses Wort mit dieser Bedeutung ist bereits vorhanden.');assert(state.custom.length<2000,'Maximal 2000 eigene Einträge.');const w=validateWord({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),no,de,...(sentence?{sentence,sentenceDe}:{})});state.custom.push(w);save();rebuild();navigate('words');toast('Dein Eintrag ist bereit zum Lernen.')}catch(err){toast(err.message)}return}if(f.id==='editor-form'&&editorOpen){try{assert(data.get('json').length<500000,'Die Datei ist zu gross.');const incoming=JSON.parse(data.get('json'));assert(Array.isArray(incoming.units)&&incoming.units.length>0,'Erwartet wird ein Objekt mit units-Liste.');const extra=incoming.units.map(validateUnit);const candidate=JSON.parse(JSON.stringify(state));candidate.extensions.push(...extra);validateState(candidate);state=candidate;save();rebuild();navigate('home');toast(`${extra.length} Einheiten hinzugefügt.`)}catch(err){toast('Nicht importiert: '+err.message)}}});
document.addEventListener('input',e=>{if(e.target.id==='challenge-draft'&&state.round){state.round.draft=e.target.value;save()}if(e.target.id==='search')$('#word-results').innerHTML=wordRows(e.target.value)});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='auto-audio'){state.autoAudio=el.checked;speech.activate();save();if(el.checked)speech.speak('Hei! Velkommen.',true);else speech.stop()}if(el.id==='mixed'){state.mixed=el.checked;save()}if(el.id==='reverse'){state.reverse=el.checked;save()}if(el.id==='theme-select'){state.theme=el.value;applyTheme();save()}if(el.id==='restore'){const file=el.files[0];if(!file)return;try{assert(file.size<2500000,'Sicherung ist zu gross.');const candidate=validateState(JSON.parse(await file.text()));if(!confirm('Aktuellen Lernstand durch diese Sicherung ersetzen?'))return;speech.stop();state=candidate;try{lastSavedRaw=localStorage.getItem(KEY)}catch(_){}storageBlocked=false;$('#storage-alert').hidden=true;save();rebuild();applyTheme();navigate('home');toast(storageBlocked?'Importiert, aber nur in dieser Sitzung.':'Sicherung wiederhergestellt.')}catch(err){toast('Import abgelehnt: '+err.message)}el.value=''}});
// Horizontal swipes are optional. Vertical scrolling and zoom remain native.
let pointer=null;document.addEventListener('pointerdown',e=>{if(!e.target.closest('#flashcard')||e.target.closest('button')||!e.isPrimary)return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY,time:Date.now()}});document.addEventListener('pointerup',e=>{if(!pointer||e.pointerId!==pointer.id)return;const p=pointer;pointer=null;const dx=e.clientX-p.x,dy=e.clientY-p.y;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*2&&Date.now()-p.time<1000)rate(dx>0)});document.addEventListener('pointercancel',()=>pointer=null);
document.addEventListener('visibilitychange',()=>{if(document.hidden){speech.stop()}else{speech.refresh();if(view==='home')render(false)}});window.addEventListener('pagehide',()=>speech.stop());window.addEventListener('storage',e=>{if(e.key!==KEY)return;storageBlocked=true;storageAlert('Der Lernstand wurde in einem anderen Tab geändert. Dieser Tab speichert nicht mehr. Exportiere bei Bedarf und lade die Seite neu.');speech.stop()});const media=matchMedia('(prefers-color-scheme: dark)');if(media.addEventListener)media.addEventListener('change',()=>{if(state.theme==='system')applyTheme()});load();rebuild();applyTheme();render(false);
</script></body></html>
