<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101012">
<meta name="color-scheme" content="dark light">
<title>Watch Fahrplan</title>
<style>
:root{
  color-scheme:dark;
  /* Material 3-inspired tokens, tuned for a watch-sized viewport */
  --md-sys-color-background:#111114;
  --md-sys-color-surface:#19191d;
  --md-sys-color-surface-container:#202025;
  --md-sys-color-surface-high:#2a2a30;
  --md-sys-color-surface-highest:#35353c;
  --md-sys-color-on-surface:#f4f0f2;
  --md-sys-color-on-surface-variant:#c5c0c6;
  --md-sys-color-outline:#77727a;
  --md-sys-color-outline-variant:#49464d;
  --md-sys-color-primary:#ffb4b7;
  --md-sys-color-primary-container:#7f1822;
  --md-sys-color-on-primary:#4b0710;
  --md-sys-color-on-primary-container:#ffdadb;
  --md-sys-color-secondary-container:#494148;
  --md-sys-color-on-secondary-container:#f2dfe6;
  --md-sys-color-tertiary:#a8d8b5;
  --md-sys-color-error:#ffb4ab;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;
  --shape-small:8px;--shape-medium:12px;--shape-large:16px;--shape-extra-large:24px;
  --bg:var(--md-sys-color-background);--surface:var(--md-sys-color-surface-container);
  --surface2:var(--md-sys-color-surface-high);--surface3:var(--md-sys-color-surface-highest);
  --text:var(--md-sys-color-on-surface);--muted:var(--md-sys-color-on-surface-variant);
  --line:var(--md-sys-color-outline-variant);--red:#e21e2b;--red-soft:var(--md-sys-color-primary-container);
  --green:var(--md-sys-color-tertiary);--radius:var(--shape-large);
  font-family:Roboto, "Google Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{min-height:100svh;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));overflow-x:hidden;overscroll-behavior:none}
button,input{font:inherit}
button{min-height:44px;border:0;border-radius:var(--shape-extra-large);padding:10px 14px;background:var(--surface2);color:var(--text);font-weight:650;font-size:13px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background-color .16s ease,transform .16s ease}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible{outline:2px solid var(--md-sys-color-primary);outline-offset:2px}
button:disabled{opacity:.38;cursor:default}
input{width:100%;min-height:48px;padding:12px 12px;border:1px solid var(--line);border-radius:var(--shape-small);color:var(--text);background:var(--surface2);font-size:16px;font-weight:550}
input::placeholder{color:var(--muted);font-size:14px;font-weight:400}
.app{width:100%;max-width:360px;margin:0 auto;padding-top:var(--space-3)}
h1{margin:0 0 var(--space-3);font-size:clamp(22px,7vw,28px);line-height:1.12;letter-spacing:-.035em;font-weight:750}
.subtitle{margin:0 0 var(--space-4);color:var(--muted);font-size:13px;line-height:1.4}
.kicker{margin:0 0 var(--space-2);color:var(--md-sys-color-primary);font-size:10px;font-weight:750;letter-spacing:.12em}
.screen{display:block}.hidden{display:none!important}
.menu{display:grid;gap:var(--space-2)}
.menu-item{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) 16px;align-items:center;gap:var(--space-3);min-height:68px;padding:var(--space-3);border:1px solid transparent;border-radius:var(--shape-extra-large);background:var(--surface);text-align:left}
.menu-item.primary-menu{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}
.menu-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--surface3);font-size:19px;color:var(--text)}
.primary-menu .menu-icon{background:var(--md-sys-color-on-primary-container);color:var(--md-sys-color-on-primary-container);background:rgba(255,218,219,.16)}
.menu-copy strong{display:block;font-size:14px;line-height:1.25;font-weight:700}
.menu-copy small{display:block;margin-top:4px;color:var(--muted);font-size:11px;line-height:1.3;font-weight:450}
.primary-menu .menu-copy small{color:var(--md-sys-color-on-primary-container)}.chevron{color:var(--muted);font-size:21px;text-align:right}.primary-menu .chevron{color:var(--md-sys-color-on-primary-container)}
.saved-preview{margin-top:var(--space-3);padding:var(--space-3);border:1px solid var(--line);border-radius:var(--shape-large);background:var(--surface)}
.preview-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
.preview-label{font-size:10px;color:var(--muted);font-weight:750;letter-spacing:.08em}
.preview-route{margin-top:var(--space-2);font-size:14px;font-weight:700;line-height:1.3}.preview-time{margin-top:4px;color:var(--muted);font-size:12px}
.small-action{min-height:36px;padding:7px 12px;border-radius:var(--shape-extra-large);font-size:12px;background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.panel{padding:var(--space-4);border:1px solid var(--line);border-radius:var(--shape-extra-large);background:var(--surface)}
.fields{display:grid;gap:var(--space-3)}.field label{display:block;margin:0 0 var(--space-1) 2px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em}.field{position:relative}
.field.from:before,.field.to:before{content:"";position:absolute;left:13px;top:37px;width:8px;height:8px;border:2px solid var(--md-sys-color-primary);border-radius:50%;pointer-events:none}.field.to:before{border-radius:2px}.field input{padding-left:34px}
.inline-tools{display:flex;justify-content:flex-end;margin-top:-8px}.ghost{min-height:36px;padding:6px 10px;color:var(--md-sys-color-primary);background:transparent;font-size:12px}
.quick-title{margin:var(--space-4) 2px var(--space-2);color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.08em}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-2)}.quick button{min-height:42px;padding:8px;border:1px solid var(--line);border-radius:var(--shape-extra-large);background:var(--surface2);font-size:12px;font-weight:600}
.time-options{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-3)}.time-options button{min-height:44px;border:1px solid var(--line);border-radius:var(--shape-extra-large);font-size:12px}
.time-options .selected{border-color:transparent;background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.time-input{display:none;margin-top:var(--space-2)}.time-input.visible{display:block}
.primary{width:100%;min-height:50px;margin-top:var(--space-3);border-radius:var(--shape-extra-large);background:var(--red);color:#fff;font-size:14px;font-weight:750}
.secondary{border:1px solid var(--line);background:var(--surface2);font-size:12px;font-weight:650}
.status{margin:var(--space-3) 2px 0;padding:var(--space-3);border-radius:var(--shape-medium);background:var(--surface2);color:var(--muted);font-size:12px;line-height:1.45}.status.error{border-left:3px solid var(--md-sys-color-error);color:var(--text)}
.screen-head{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)}.back{min-height:40px;padding:7px 12px;border-radius:var(--shape-extra-large);font-size:12px;background:var(--surface2)}.screen-head h1{font-size:21px;margin:0}
.connection{overflow:hidden;border:1px solid var(--line);border-radius:var(--shape-extra-large);background:var(--surface)}.connection-main{padding:var(--space-4)}
.route-label{display:flex;justify-content:space-between;gap:var(--space-2);color:var(--muted);font-size:11px;font-weight:650}
.times{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--space-2);margin:var(--space-4) 0 var(--space-2)}
.time{font-size:clamp(28px,9vw,38px);font-weight:750;letter-spacing:-.055em;line-height:1;font-variant-numeric:tabular-nums}.time:last-child{text-align:right}.arrow{color:var(--md-sys-color-primary);font-size:19px;font-weight:700}
.stations{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);color:var(--muted);font-size:12px;font-weight:550;line-height:1.3}.stations span:last-child{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-3)}.chip{padding:6px 9px;border-radius:var(--shape-small);background:var(--surface3);font-size:11px;font-weight:650}.chip.red{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}
.detail-button{width:100%;min-height:44px;padding:9px var(--space-4);border-top:1px solid var(--line);border-radius:0;display:flex;justify-content:space-between;align-items:center;background:transparent;color:var(--md-sys-color-primary);font-size:12px;font-weight:650}
.details{padding:0 var(--space-3) var(--space-3)}.leg{margin-top:var(--space-2);padding:var(--space-3);border-radius:var(--shape-large);background:var(--surface2)}
.leg-top{display:flex;justify-content:space-between;gap:var(--space-2);align-items:center;margin-bottom:var(--space-2)}.line{padding:5px 8px;border-radius:var(--shape-small);background:var(--red);color:#fff;font-size:11px;font-weight:750}.direction{color:var(--muted);font-size:11px;text-align:right}
.leg-times{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}.leg-point:last-child{text-align:right}.leg-time{display:block;font-size:18px;font-weight:750;font-variant-numeric:tabular-nums}.leg-station{display:block;margin-top:4px;font-size:12px;font-weight:650;line-height:1.3}.platform{display:block;margin-top:4px;color:var(--green);font-size:11px;font-weight:650}
.transfer{margin:var(--space-2) 0;padding:var(--space-2) var(--space-3);border-left:3px solid var(--md-sys-color-primary);background:var(--surface2);border-radius:0 var(--shape-small) var(--shape-small) 0}.transfer-head{display:flex;justify-content:space-between;gap:var(--space-2);font-size:12px;font-weight:700}.transfer-sub{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.45;white-space:pre-line}
.stops{margin-top:var(--space-2)}.stops summary{min-height:40px;padding:10px 0 2px;color:var(--md-sys-color-primary);font-size:12px;font-weight:650}.stop-list{display:grid;gap:var(--space-2);margin:var(--space-2) 0 0;padding:0;list-style:none}.stop-list li{display:grid;grid-template-columns:40px 1fr auto;gap:var(--space-1);font-size:11px}.stop-list time,.stop-platform{color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-3)}.actions button{min-height:44px;padding:8px;font-size:11px}.actions .active{border-color:transparent;background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.nav-actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-2)}.nav-actions button{min-height:44px}.counter{text-align:center;margin-top:var(--space-2);color:var(--muted);font-size:11px;font-weight:650}
.empty{padding:var(--space-5) var(--space-3);text-align:center;color:var(--muted);font-size:12px;line-height:1.5}.loading{padding:32px 8px;text-align:center;color:var(--muted);font-size:13px;font-weight:600}.spinner{display:block;width:24px;height:24px;margin:0 auto var(--space-3);border:3px solid var(--line);border-top-color:var(--md-sys-color-primary);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;margin:var(--space-5) 4px 2px;color:var(--muted);font-size:10px;line-height:1.4}
@media(prefers-color-scheme:light){:root{color-scheme:light;--md-sys-color-background:#f7f5f5;--md-sys-color-surface:#fff;--md-sys-color-surface-container:#f0edef;--md-sys-color-surface-high:#e9e5e8;--md-sys-color-surface-highest:#dfdade;--md-sys-color-on-surface:#1c1b1f;--md-sys-color-on-surface-variant:#49454f;--md-sys-color-outline:#79747e;--md-sys-color-outline-variant:#cac4d0;--md-sys-color-primary:#a51622;--md-sys-color-primary-container:#ffdadb;--md-sys-color-on-primary:#fff;--md-sys-color-on-primary-container:#410009;--md-sys-color-secondary-container:#eadde2;--md-sys-color-on-secondary-container:#25171d;--md-sys-color-tertiary:#176b3b;--md-sys-color-error:#ba1a1a;--red-soft:#ffdadb}}
@media(max-width:210px){body{padding-left:6px;padding-right:6px}h1{font-size:22px}.subtitle{font-size:12px;margin-bottom:var(--space-3)}.menu{gap:6px}.menu-item{grid-template-columns:34px minmax(0,1fr) 12px;gap:8px;min-height:60px;padding:9px;border-radius:18px}.menu-icon{width:34px;height:34px}.menu-copy strong{font-size:12px}.menu-copy small{font-size:10px}.panel{padding:12px}.time{font-size:27px}.quick{gap:6px}.quick button{font-size:11px;min-height:40px}.primary{font-size:13px}.screen-head h1{font-size:19px}}
@media(max-width:170px){.menu-item{grid-template-columns:30px minmax(0,1fr) 10px;gap:6px;padding:8px}.menu-icon{width:30px;height:30px}.menu-copy strong{font-size:11px}.menu-copy small{font-size:9px}.panel{padding:10px}.times{gap:4px}.time{font-size:24px}.stations{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app">
<section id="home-screen" class="screen">
 <h1>Fahrplan</h1>
 <nav class="menu" aria-label="Hauptmenü">
  <button class="menu-item primary-menu" id="go-search">
   <span class="menu-icon">⌕</span><span class="menu-copy"><strong>Verbindung suchen</strong><small>Start und Ziel eingeben</small></span><span class="chevron">›</span>
  </button>
  <button class="menu-item" id="go-last">
   <span class="menu-icon">↶</span><span class="menu-copy"><strong>Letzte Fahrt</strong><small id="last-description">Letzte Verbindung</small></span><span class="chevron">›</span>
  </button>
  <button class="menu-item" id="go-saved">
   <span class="menu-icon">★</span><span class="menu-copy"><strong>Gespeicherte Strecke</strong><small id="saved-description">Gespeicherte Verbindung</small></span><span class="chevron">›</span>
  </button>
 </nav>
 <div id="home-preview" class="saved-preview hidden">
  <div class="preview-top"><span class="preview-label">LETZTE VERBINDUNG</span><button id="open-last" class="small-action">Öffnen</button></div>
  <div class="preview-route" id="preview-route"></div>
  <div class="preview-time" id="preview-time"></div>
 </div>
 <p class="footer">Daten: transport.opendata.ch</p>
</section>

<section id="search-screen" class="screen hidden">
 <div class="screen-head"><button class="back" data-home>‹ Menü</button><h1>Verbindung suchen</h1></div>
 <div class="panel">
  <div class="fields">
   <div class="field from"><label for="from-input">VON</label><input id="from-input" type="text" placeholder="Startort" autocomplete="off" autocapitalize="words"></div>
   <div class="inline-tools"><button id="swap-button" class="ghost" type="button">↑↓ Tauschen</button></div>
   <div class="field to"><label for="to-input">NACH</label><input id="to-input" type="text" placeholder="Zielort" autocomplete="off" autocapitalize="words"></div>
  </div>
  <p class="quick-title">HÄUFIGE ORTE</p>
  <div class="quick">
   <button data-place="Winterthur">Winterthur</button><button data-place="Zürich HB">Zürich HB</button>
   <button data-place="Gibswil">Gibswil</button><button data-place="Basel SBB">Basel SBB</button>
  </div>
  <div class="time-options">
   <button id="now-button" class="selected" aria-pressed="true">● Jetzt</button>
   <button id="later-button" aria-pressed="false">◷ Zeit wählen</button>
  </div>
  <input id="time-input" class="time-input" type="time" aria-label="Abfahrtszeit">
 </div>
 <button id="search-button" class="primary">Verbindungen suchen&nbsp; →</button>
 <p id="form-status" class="status hidden" role="alert"></p>
</section>

<section id="loading-screen" class="screen hidden" aria-live="polite">
 <div class="loading"><span class="spinner"></span>Verbindungen werden geladen …</div>
</section>

<section id="results-screen" class="screen hidden">
 <div class="screen-head"><button class="back" data-home>‹ Menü</button><h1>Verbindungen</h1></div>
 <div id="connection-list"></div>
 <div class="nav-actions"><button id="previous-button" class="secondary">‹ Davor</button><button id="next-button" class="secondary">Danach ›</button></div>
 <div id="counter" class="counter"></div>
 <p id="result-status" class="status hidden" role="status"></p>
</section>

<section id="last-screen" class="screen hidden">
 <div class="screen-head"><button class="back" data-home>‹ Menü</button><h1>Letzte Fahrt</h1></div>
 <div id="last-content"></div>
 <button id="repeat-last" class="primary">Gleiche Strecke neu suchen →</button>
</section>

<section id="saved-screen" class="screen hidden">
 <div class="screen-head"><button class="back" data-home>‹ Menü</button><h1>Gespeicherte Strecke</h1></div>
 <div id="saved-content"></div>
 <button id="search-saved" class="primary">Verbindungen anzeigen →</button>
 <button id="delete-saved" class="secondary" style="width:100%;margin-top:6px">Strecke entfernen</button>
</section>
</main>

<script>
(() => {
'use strict';
const API='https://transport.opendata.ch/v1/connections';
const $=id=>document.getElementById(id);
const screens=['home','search','loading','results','last','saved'];
const state={route:null,connections:[],index:0,scheduled:false,busy:false,earlier:true,later:true,last:null,saved:null};
const KEY_LAST='watchSbbLastTripV2',KEY_SAVED='watchSbbSavedRouteV2',KEY_ROUTE='watchSbbRouteV2';

function show(name){screens.forEach(s=>$(`${s}-screen`).classList.toggle('hidden',s!==name));}
function status(id,msg,error=false){const el=$(id);el.textContent=msg;el.classList.toggle('hidden',!msg);el.classList.toggle('error',!!msg&&error);}
function read(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}}
function write(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){console.warn('Speichern nicht möglich',e)}}
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=String(text);return e}
function date(value){if(!value)return null;const d=new Date(value);return Number.isFinite(d.getTime())?d:null}
function time(value){const d=date(value);return d?d.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}):'–:–'}
function duration(a,b){const x=date(a),y=date(b);if(!x||!y||y<x)return'';const m=Math.round((y-x)/60000),h=Math.floor(m/60),r=m%60;return h?`${h} h ${r} min`:`${m} min`}
function info(j={}){const c=String(j.category||j.subcategory||'').toUpperCase();let type='Zug';if(/^(BAT|BOAT|SCHIFF)/.test(c))type='Schiff';else if(/^(BUS|B|NFB|TROL)/.test(c))type='Bus';else if(/^(TRAM|T$)/.test(c))type='Tram';let line=c==='S'&&j.number?`S${j.number}`:type!=='Zug'?(j.number||j.subcategory||j.category):[j.category,j.number].filter(Boolean).join(' ');return{type,line:line||j.name||type,direction:j.to||''}}
function platform(stop,type){const p=stop?.prognosis?.platform||stop?.platform||'';if(!p)return'Gleis offen';return`${type==='Bus'?'Steig':type==='Schiff'?'Steg':type==='Tram'?'Kante':'Gleis'} ${p}`}
function rides(c){return(c.sections||[]).filter(s=>s.journey&&s.departure&&s.arrival)}
function getRoute(c){return{from:c.from?.station?.name||state.route?.from||'',to:c.to?.station?.name||state.route?.to||'',departure:c.from?.departure||'',arrival:c.to?.arrival||'',duration:duration(c.from?.departure,c.to?.arrival),transfers:Number.isInteger(c.transfers)?c.transfers:Math.max(0,rides(c).length-1),connection:c}}
function renderStops(section,ti){const stops=(section.journey.passList||[]).slice(1,-1),d=node('details','stops');d.append(node('summary','',`${stops.length} Zwischenhalte`));if(stops.length){const ol=node('ol','stop-list');stops.forEach(s=>{const li=node('li');li.append(node('time','',time(s.arrival||s.departure)),node('span','',s.station?.name||'Halt'),node('span','stop-platform',s.platform?platform(s,ti.type):''));ol.append(li)});d.append(ol)}return d}
function renderLeg(s){const ti=info(s.journey),leg=node('div','leg'),top=node('div','leg-top');top.append(node('span','line',`${ti.type} ${ti.line}`));if(ti.direction)top.append(node('span','direction',`Richtung ${ti.direction}`));const grid=node('div','leg-times');[[s.departure,'departure'],[s.arrival,'arrival']].forEach(([p,k],i)=>{const box=node('div','leg-point');box.append(node('time','leg-time',time(k==='departure'?p.departure:p.arrival)),node('span','leg-station',p.station?.name||''),node('span','platform',platform(p,ti.type)));grid.append(box)});leg.append(top,grid,renderStops(s,ti));return leg}
function renderTransfer(a,b){const x=a.arrival,y=b.departure,tx=info(a.journey),ty=info(b.journey),wrap=node('div','transfer'),head=node('div','transfer-head');head.append(node('span','',`Umstieg · ${x.station?.name||y.station?.name||''}`),node('span','',duration(x.arrival,y.departure)));wrap.append(head,node('div','transfer-sub',`An ${time(x.arrival)} · ${platform(x,tx.type)}\nWeiter ${time(y.departure)} · ${platform(y,ty.type)}`));return wrap}
function renderCard(c,allowSave=true){const r=getRoute(c),sections=rides(c),card=node('article','connection'),main=node('div','connection-main'),label=node('div','route-label');label.append(node('span','',r.from),node('span','',r.to));const times=node('div','times');times.append(node('time','time',time(r.departure)),node('span','arrow','→'),node('time','time',time(r.arrival)));const stations=node('div','stations');stations.append(node('span','',r.from),node('span','',r.to));const chips=node('div','chips');chips.append(node('span','chip',r.duration||'Dauer n. a.'),node('span',r.transfers?'chip':'chip red',r.transfers?`${r.transfers} × Umsteigen`:'Direktverbindung'));if(sections[0]){const t=info(sections[0].journey);chips.append(node('span','chip red',`${t.type} ${t.line}`))}main.append(label,times,stations,chips);
 const toggle=node('button','detail-button'),detail=node('div','details hidden');toggle.type='button';toggle.append(node('span','','Details und Gleise'),node('span','','＋'));sections.forEach((s,i)=>{if(i)detail.append(renderTransfer(sections[i-1],s));detail.append(renderLeg(s))});toggle.addEventListener('click',()=>{const open=detail.classList.toggle('hidden')===false;toggle.lastChild.textContent=open?'−':'＋';});card.append(main,toggle,detail);
 if(allowSave){const acts=node('div','actions'),save=node('button','secondary','★ Strecke merken'),last=node('button','secondary','Letzte Fahrt');save.type=last.type='button';save.addEventListener('click',()=>{write(KEY_SAVED,{from:r.from,to:r.to});state.saved={from:r.from,to:r.to};refreshHome();save.textContent='✓ Gespeichert';save.classList.add('active')});last.addEventListener('click',()=>{saveLast(c);showLast()});acts.append(save,last);card.append(acts)}
 return card}
function saveLast(c){const r=getRoute(c);state.last={from:state.route?.from||r.from,to:state.route?.to||r.to,shownFrom:r.from,shownTo:r.to,departure:r.departure,arrival:r.arrival,savedAt:new Date().toISOString(),connection:c};write(KEY_LAST,state.last)}
function renderResult(){const list=$('connection-list');list.replaceChildren();if(!state.connections.length){list.append(node('div','connection empty','Keine Verbindung gefunden.'));$('counter').textContent='0 VERBINDUNGEN';$('previous-button').disabled=$('next-button').disabled=true;return}const c=state.connections[state.index];list.append(renderCard(c));$('counter').textContent=`${state.index+1} / ${state.connections.length}`;$('previous-button').disabled=state.index===0&&!state.earlier;$('next-button').disabled=state.index===state.connections.length-1&&!state.later;saveLast(c);refreshHome()}
async function request(params={}){const q=new URLSearchParams({from:state.route.from,to:state.route.to,limit:String(params.limit||5)});if(params.time){q.set('date',new Date().toISOString().slice(0,10));q.set('time',params.time);q.set('isArrivalTime',params.arrival?'1':'0')}else if(state.route.time)q.set('time',state.route.time);const res=await fetch(`${API}?${q}`,{headers:{Accept:'application/json'}});if(!res.ok)throw Error(`API ${res.status}`);const data=await res.json();return Array.isArray(data.connections)?data.connections:[]}
async function search(from,to,scheduledTime=''){if(!from?.trim()||!to?.trim()){show('search');status('form-status','Start und Ziel eingeben.',true);return}state.route={from:from.trim(),to:to.trim(),time:scheduledTime};write(KEY_ROUTE,{from:state.route.from,to:state.route.to});status('form-status','');show('loading');try{state.connections=await request({limit:5});state.index=0;state.earlier=state.connections.length>0;state.later=state.connections.length>=5;status('result-status','');show('results');renderResult();if(!state.connections.length)status('result-status','Keine Verbindungen gefunden.')}catch(e){console.error(e);show('search');status('form-status','Fahrplan nicht erreichbar. Internetverbindung prüfen.',true)}}
async function adjacent(dir){if(state.busy||!state.connections.length)return;if(dir==='prev'&&state.index>0){state.index--;renderResult();return}if(dir==='next'&&state.index<state.connections.length-1){state.index++;renderResult();return}const earlier=dir==='prev',edge=earlier?state.connections[0]:state.connections[state.connections.length-1],anchor=edge?.from?.departure;if(!anchor||(earlier?!state.earlier:!state.later))return;state.busy=true;$('previous-button').disabled=$('next-button').disabled=true;status('result-status','Lade weitere Fahrten …');try{const candidates=await request({time:earlier?(edge.to?.arrival||anchor):anchor,arrival:earlier,limit:8}),ms=new Date(anchor).getTime(),items=candidates.filter(c=>{const d=new Date(c.from?.departure).getTime();return Number.isFinite(d)&&(earlier?d<ms:d>ms)}).sort((a,b)=>new Date(a.from.departure)-new Date(b.from.departure));if(!items.length){if(earlier)state.earlier=false;else state.later=false;status('result-status',earlier?'Keine früheren Fahrten.':'Keine späteren Fahrten.')}else if(earlier){const part=items.slice(-3);state.connections=[...part,...state.connections];state.index=part.length-1;state.earlier=items.length>3;status('result-status','')}else{const part=items.slice(0,3);state.connections=[...state.connections,...part];state.index++;state.later=items.length>3;status('result-status','')}}catch(e){console.error(e);status('result-status','Weitere Verbindungen nicht verfügbar.',true)}finally{state.busy=false;renderResult()}}
function refreshHome(){state.last=read(KEY_LAST);state.saved=read(KEY_SAVED);$('last-description').textContent=state.last?`${state.last.from} → ${state.last.to}`:'Noch keine Fahrt gesucht';$('saved-description').textContent=state.saved?`${state.saved.from} → ${state.saved.to}`:'Noch keine Strecke gespeichert';const p=$('home-preview');p.classList.toggle('hidden',!state.last);if(state.last){$('preview-route').textContent=`${state.last.from} → ${state.last.to}`;$('preview-time').textContent=`Zuletzt ${time(state.last.departure)} · ${state.last.savedAt?new Date(state.last.savedAt).toLocaleDateString('de-CH'):''}`}}
function showLast(){state.last=read(KEY_LAST);const box=$('last-content');box.replaceChildren();if(!state.last){box.append(node('div','connection empty','Noch keine Fahrt gespeichert.'));$('repeat-last').disabled=true}else{$('repeat-last').disabled=false;box.append(renderCard(state.last.connection,false));const note=node('p','status',`Gespeichert: ${new Date(state.last.savedAt).toLocaleString('de-CH')}`);box.append(note)}show('last')}
function showSaved(){state.saved=read(KEY_SAVED);const box=$('saved-content');box.replaceChildren();const has=!!(state.saved?.from&&state.saved?.to);$('search-saved').disabled=$('delete-saved').disabled=!has;if(has){const card=node('div','connection'),main=node('div','connection-main');main.append(node('div','route-label','GESPEICHERTE STRECKE'),node('div','preview-route',`${state.saved.from} → ${state.saved.to}`),node('p','subtitle','Verbindungen für diese Strecke suchen.'));card.append(main);box.append(card)}else box.append(node('div','connection empty','Keine Strecke gespeichert.'));show('saved')}
$('go-search').addEventListener('click',()=>{const old=read(KEY_ROUTE);if(old){$('from-input').value=old.from||'';$('to-input').value=old.to||''}show('search')});
$('go-last').addEventListener('click',showLast);
$('open-last').addEventListener('click',showLast);
$('go-saved').addEventListener('click',showSaved);
document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',()=>{refreshHome();show('home')}));
$('search-button').addEventListener('click',()=>search($('from-input').value,$('to-input').value,state.scheduled?$('time-input').value:''));
$('previous-button').addEventListener('click',()=>adjacent('prev'));
$('next-button').addEventListener('click',()=>adjacent('next'));
$('swap-button').addEventListener('click',()=>{const a=$('from-input').value;$('from-input').value=$('to-input').value;$('to-input').value=a});
document.querySelectorAll('[data-place]').forEach(b=>b.addEventListener('click',()=>{const target=!$('from-input').value.trim()?$('from-input'):$('to-input');target.value=b.dataset.place;if(target===$('from-input'))$('to-input').focus()}));
$('now-button').addEventListener('click',()=>{state.scheduled=false;$('now-button').classList.add('selected');$('later-button').classList.remove('selected');$('now-button').setAttribute('aria-pressed','true');$('later-button').setAttribute('aria-pressed','false');$('time-input').classList.remove('visible')});
$('later-button').addEventListener('click',()=>{state.scheduled=true;$('later-button').classList.add('selected');$('now-button').classList.remove('selected');$('later-button').setAttribute('aria-pressed','true');$('now-button').setAttribute('aria-pressed','false');$('time-input').classList.add('visible');$('time-input').focus()});
$('repeat-last').addEventListener('click',()=>{const l=read(KEY_LAST);if(l){$('from-input').value=l.from;$('to-input').value=l.to;show('search');search(l.from,l.to)}});
$('search-saved').addEventListener('click',()=>{const s=read(KEY_SAVED);if(s){$('from-input').value=s.from;$('to-input').value=s.to;show('search');search(s.from,s.to)}});
$('delete-saved').addEventListener('click',()=>{localStorage.removeItem(KEY_SAVED);state.saved=null;showSaved();refreshHome()});
state.last=read(KEY_LAST);state.saved=read(KEY_SAVED);refreshHome();
})();
</script>
</body>
