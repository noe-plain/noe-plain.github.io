<!doctype html>
<html lang="de-CH" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fcfcfd" />
    <title>MKW Studio · Deine Tools. Ein Ort.</title>
    <link rel="stylesheet" href="studio/static/ui-theme-tokens.css" />
    <link rel="stylesheet" href="style.css?v=20261030" />
    <script src="studio/static/ui-colour-model.js" defer></script>
    <script src="tools.js?v=20261030" defer></script>
    <script src="main.js?v=20261030" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#toolsTitle">Zu den Tools</a>
    <header class="hub-header">
      <a class="hub-brand" href="./" aria-label="MKW Studio · Toolübersicht"
        ><img
          id="hubLogo"
          src="studio/mkw-logo-bold-pos.svg"
          alt="Musikkollegium Winterthur"
          width="240"
          height="46"
        /><span>MKW Studio</span></a
      >
      <button
        type="button"
        id="themeToggle"
        aria-label="Dunkle Darstellung verwenden"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <use href="studio/static/icons/material-symbols.svg#dark_mode"></use>
        </svg>
      </button>
    </header>
    <main>
      <section class="hub-intro" aria-labelledby="pageTitle">
        <span class="hub-eyebrow">Dein kreativer Arbeitsplatz</span>
        <h1 id="pageTitle">Deine Tools.<br /><span>Ein Ort.</span></h1>
        <p>
          Gestalten, vorbereiten und weiterarbeiten. Wähle das Werkzeug für
          deine nächste Aufgabe.
        </p>
      </section>
      <section class="hub-directory" aria-labelledby="toolsTitle">
        <div class="hub-section-heading">
          <h2 id="toolsTitle">Womit möchtest du arbeiten?</h2>
          <span id="toolAvailability"></span>
        </div>
        <div id="toolsGrid" class="tools-grid"></div>
        <noscript
          ><p>
            <a href="./studio/">MKW Studio öffnen</a> ·
            <a href="./webp-konverter/">WebP-Konverter öffnen</a>
          </p>
          <p>Ein PDF-Editor ist geplant.</p></noscript
        >
      </section>
      <p id="hubStatus" role="status"></p>
    </main>
    <footer class="hub-footer">
      <span>Musikkollegium Winterthur</span
      ><span
        >Deine Dateien werden im jeweiligen Tool auf deinem Gerät
        verarbeitet.</span
      >
    </footer>
  </body>
</html>
